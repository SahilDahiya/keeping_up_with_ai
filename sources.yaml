# Source registry — feed/sitemap URLs verified live 2026-07-10 (see DESIGN.md §3).
defaults:
  rate_limit_seconds: 2

sources:
  - slug: sierra
    name: Sierra Blog
    home: https://sierra.ai/blog/engineering
    feed: https://sierra.ai/rss.xml            # site-wide; filtered to /blog/
    sitemap: https://sierra.ai/sitemap.xml
    include_prefixes: ["/blog/"]
    tags: [agents, customer-experience]

  - slug: cresta
    name: Cresta Blog
    home: https://cresta.com/blog
    sitemap: https://cresta.com/sitemap.xml    # multilingual; /blog/ prefix keeps EN only
    discovery: [sitemap]
    include_prefixes: ["/blog/"]
    # Cresta's blog is ~86% non-engineering (awards, hires, funding, expansion PR).
    # Drop the unambiguous company-news slug shapes before scraping — verified to
    # match 0 of the 41 filed engineering posts. The classify triage still backstops
    # anything new that slips through; this just stops the obvious daily PR churn.
    exclude_regex: "/blog/(cresta-crew-|leadership-spotlight-|cresta-leadership-update|cresta-named-|.*-names-cresta-|.*-hot-vendor|cresta-(achieves|secures|wins|recognized|raises)-|.*-joins-cresta|.*-joins-crestas-board|cresta-continues-international-expansion|were-going-global|cresta-expands-to|crestas-commitment-to-|a-letter-from-our-founders)"
    tags: [agents, contact-center]

  - slug: baseten
    name: Baseten Blog
    home: https://www.baseten.co/blog/
    sitemap: https://www.baseten.co/sitemap.xml
    discovery: [sitemap]
    include_prefixes: ["/blog/"]
    exclude_regex: "^/blog/category/"         # category listing pages, not articles
    tags: [inference, infra]

  - slug: anthropic-engineering
    name: Anthropic Engineering
    home: https://www.anthropic.com/engineering
    sitemap: https://www.anthropic.com/sitemap.xml
    discovery: [sitemap]
    include_prefixes: ["/engineering/"]
    tags: [agents, llm-vendors]

  - slug: openai-devs
    name: OpenAI Developers Blog
    home: https://developers.openai.com/blog
    feed: https://developers.openai.com/rss.xml
    sitemap: https://developers.openai.com/sitemap-index.xml
    include_prefixes: ["/blog/"]
    exclude_regex: "^/blog/topic/"   # tag-index listing pages, not articles
    tags: [llm-vendors]

  # Cloudflare Blog (AI tag) removed 2026-07-27 (user-directed): the /tag/ai/ feed
  # was a low-signal firehose — ~65% product/business/policy announcements (Agents
  # Week, monetization gateway, spend limits) with only ~7 real engineering posts.
  # Whole source dropped and all 20 filed articles purged.

  - slug: fireworks
    name: Fireworks AI Blog
    home: https://fireworks.ai/blog
    sitemap: https://fireworks.ai/sitemap.xml
    discovery: [sitemap]
    include_prefixes: ["/blog/"]
    tags: [inference]

  - slug: together
    name: Together AI Blog
    home: https://www.together.ai/blog
    feed: https://www.together.ai/blog/rss.xml
    sitemap: https://www.together.ai/sitemap.xml
    include_prefixes: ["/blog/"]
    tags: [inference, training]

  - slug: modal
    name: Modal Blog
    home: https://modal.com/blog
    feed: https://modal.com/blog/atom.xml      # no sitemap exists; feed-only (shallow history)
    discovery: [feed]
    include_prefixes: ["/blog/"]
    tags: [infra, serverless]

  # Braintrust Blog removed 2026-07-27 (user-directed): eval-vendor blog; whole
  # source dropped and all 71 filed articles purged despite substantial eval
  # methodology content. Same source-removal pattern as Arize/Langfuse/LangChain.

  # Langfuse Blog removed 2026-07-27 (user-directed): observability-vendor blog,
  # mostly own-product / eval-methodology marketing; whole source dropped and all
  # 38 filed articles purged. Same rationale as the Arize removal above.

  # LangChain Blog removed 2026-07-27 (user-directed): framework-vendor blog;
  # whole source dropped and all 97 filed articles purged despite substantial
  # technical content. Same source-removal pattern as Arize/Langfuse above.

  # Arize AI Blog removed 2026-07-27 (user-directed): vendor blog dominated by
  # Phoenix/AX product marketing and integration tutorials; whole source dropped
  # and all 182 filed articles purged rather than keep triaging it per-post.

  - slug: huggingface
    name: Hugging Face Blog
    home: https://huggingface.co/blog
    discovery: [hf]        # no per-tag RSS; listing JSON is embedded in the page
    include_prefixes: ["/blog/"]
    # GATED: only these tags are ingested. Everything else HF publishes
    # (community submissions, partnerships, leaderboard, open-source-collab, cv,
    # lerobot) is never fetched. Adding a tag here is a deliberate act.
    hf_tags:
      - guide
      - nlp
      - research
      - rl
      - audio
      - diffusion
      - ethics
      - case-studies
      - game-dev
      - rlhf
      - inference-providers
    since: "2024-01-01"    # hard floor: nothing older is ingested, on update or backfill
    rate_limit_seconds: 6  # HF returns 429 at the 2s default; it throttles harder than most
    tags: [open-source, models]

  - slug: shopify
    name: Shopify Engineering (AI/ML)
    home: https://shopify.engineering/topics/ai-machine-learning
    sitemap: https://shopify.engineering/sitemap.xml   # flat; used to date the topic's slugs
    discovery: [shopify]  # React Router SPA, no RSS; topic .data ∩ sitemap (see discover/shopify.py)
    # Scoped to the AI/ML topic only — the eng blog covers all of Shopify engineering.
    since: "2024-01-01"
    rate_limit_seconds: 3
    prefer_hint_date: true      # trafilatura reads a constant template date from the body
    title_suffix: " - Shopify"  # strip site chrome from the extracted <title>
    tags: [production-ml, commerce]

  - slug: pydantic
    name: Pydantic Blog
    home: https://pydantic.dev/articles
    feed: https://pydantic.dev/feed.xml
    sitemap: https://pydantic.dev/sitemap.xml
    include_prefixes: ["/articles/"]   # never author/docs pages
    since: "2025-01-01"
    # High-value source (PydanticAI, Logfire, structured output) but mixed. Drop the
    # pydantic-core LIBRARY posts (releases/perf/wheels — Python, not AI) and the
    # clearest company/product-news before scraping; the classify triage backstops the
    # rest. Verified against all 121 article slugs: excludes 0 AI/agent/LLM content.
    exclude_regex: "/articles/(hiring|hiring-again|company-announcement|gregor|hack-monty.*|hallway-track.*|eu-region-launch|[a-z0-9-]*-starter-credit|[a-z0-9-]*-head-of-[a-z0-9-]*|[a-z0-9-]*-sdk-launch|mcp-launch|logfire-gateway-launch|logfire-enterprise-dedicated|ingress-to-gateway|gateway-merging-into-logfire|pydantic-v[0-9][a-z0-9-]*|pydantic-bitset[a-z0-9-]*|pydantic-validation-[a-z0-9-]*|pydantic-events|pydantic-monty|pydantic-donates-[a-z0-9-]*|emscripten-wheels-pydantic|eval-type-backport|inline-snapshot|struct-field-pushdown|how-curvy-is-your-data|bloom-filter-folding-parquet-logfire)/?$"
    tags: [agents, observability, structured-output]

  # Simon Willison's Weblog removed 2026-07-27 (user-directed): whole source
  # dropped and all 20 filed articles purged. NB: an independent high-signal
  # blog, not a vendor marketing feed — removed by explicit request, not on the
  # promo-rot rationale that drove the vendor purges.

  - slug: chip-huyen
    name: Chip Huyen's Blog
    home: https://huyenchip.com/blog/
    feed: https://huyenchip.com/feed.xml
    sitemap: https://huyenchip.com/sitemap.xml
    include_regex: "^/\\d{4}/"
    tags: [independent, ml-systems]
